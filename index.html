<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Denoised Alpha — instrument-grade terminal for the ES session: live signals, probabilistic forecasts, and DC monitoring." />
    <meta name="theme-color" content="#0a0e17" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- PWA: lets iOS Safari treat the site as installable. Once the
         user taps "Add to Home Screen" and launches from the icon,
         Safari unlocks the Notification API in standalone mode —
         that's the whole point of this file for iOS users. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS-specific meta: standalone launch behaviour, title override
         for the home-screen icon, and the apple-touch-icon fallback
         (Safari doesn't read the SVG icon out of the webmanifest). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Denoised Alpha" />
    <!-- iOS does NOT render SVG apple-touch-icons (home-screen tile
         falls back to blank/screenshot). Must be a raster PNG;
         180x180 is Apple's current recommended size. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Denoised Alpha</title>
    <style>
      /* Prevent flash of white background */
      html, body { background: #0a0e17; margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
