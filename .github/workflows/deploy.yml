name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_API_KEY: ${{ secrets.API_KEY }}
          VITE_DEMO_MODE: ${{ vars.DEMO_MODE || 'true' }}
          VITE_DC_API_URL: ${{ vars.DC_API_URL }}
          # VITE_DC_API_KEY + VITE_TERMINAL_API_KEY removed (PR-3): the
          # dashboards authenticate via the HttpOnly session cookie only,
          # so no API key is baked into the public bundle. The DC_API_KEY
          # and TERMINAL_API_KEY GitHub secrets can be deleted AFTER the
          # burned keys are rotated server-side (see the private repo's
          # rotation steps). VITE_DC_PASSWORD_HASH was removed in PR-2.
          VITE_TERMINAL_API_URL: ${{ vars.TERMINAL_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
